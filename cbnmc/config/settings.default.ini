# DON'T CHANGE THIS FILE. Use 'settings.ini' file to override this parameters.

app_name="CBNMC Dataset Import"
app_code="cbnmc"

#+----------------------------------------------------------------------------+
# Script log file
cbnmc_log_imports="${log_dir}/$(date +'%F')_imports.log"

#+----------------------------------------------------------------------------+
# Date of import
cbnmc_import_date="2026-06-13"
# Data to import filename prefix
cbnmc_filename_prefix="${cbnmc_import_date}_sinp_aura_cbnmc"
# Archive data filename to import (need to be ".csv" files into a ".tar.bz2" archive file)
cbnmc_filename_archive="${cbnmc_filename_prefix}.tar.bz2"
# Source data filename to import (need to be ".csv" file)
cbnmc_filename_source="source.csv"
# Dataset data filename to import (need to be ".csv" file)
cbnmc_filename_dataset="dataset.csv"
# Acquisition framework data filename to import (need to be ".csv" file)
cbnmc_filename_af="acquisition_framework.csv"
# Organism data filename to import (need to be ".csv" file)
cbnmc_filename_organism="organism.csv"
# User data filename to import (need to be ".csv" file)
cbnmc_filename_user="user.csv"
# Synthese data filename to import (need to be ".csv" file)
cbnmc_filename_synthese="synthese.csv"
# Validation data filename to import (need to be ".csv" file)
cbnmc_filename_validation="validation.csv"
